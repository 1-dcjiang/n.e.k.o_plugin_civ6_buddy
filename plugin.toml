[plugin]
id = "civ6_buddy"
name = "文明6陪玩"
description = "让 YUI 陪玩家打文明6：深度监控（解析 .Civ6Save 存档）获知当前局面——回合数/游戏速度/地图大小与类型/你的文明与领袖（含特性）/全部敌对文明与领袖/城邦列表/已装 MOD，据此给出陪玩建议（开局/科技/建城/战争/胜利路线/外交分主题规则化建议）。存档解析使用插件内嵌 pydt/civ6-save-parser（MIT），调用本机 node（>=16），纯只读不修改任何游戏文件。v0.1.0 首版：5 个工具（civ6_list_saves/civ6_parse_save/civ6_situation/civ6_civ_profile/civ6_advise），存档目录默认 Documents\\My Games\\Sid Meier's Civilization VI\\Saves，可在 config 覆盖"
short_description = "文明6陪玩：解析存档获知局面（回合/地图/你的文明/对手/城邦/MOD），YUI 给开局/科技/建城/战争/胜利/外交陪玩建议；内嵌存档解析器，只读不写"
keywords = ["文明6", "Civilization VI", "Civ6", "陪玩", "存档", "Civ6Save", "局面", "攻略", "开局", "科技", "建城", "战争", "胜利", "城邦", "领袖", "文明特性", "situation", "advisor", "buddy", "coach"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.civ6_buddy:Civ6BuddyPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
