[plugin]
id = "civ6_buddy"
name = "文明6陪玩"
description = """
文明6（Civilization VI）陪玩伙伴：帮你把「每回合的重复操作」自动化，让你专心打仗和决策。

■ 自动托管运营（你只需看着或去打仗）
YUI 会基于 FireTuner 官方数据处理可确认的每回合杂活，无法确认就交还：
• 推进回合前处理支持的生产、科技/市政、总督与单位等待状态，并读回真实回合号
• 自动选择可用科技/市政，按局面评分填政策槽、选万神殿、任命总督、处理单位升级
• 侦察兵自动探路（远离首都、避开水/山/己方单位），建造者可自动改良；战争即交还
• 关闭已识别的 UI 控件；自然奇观等无法安全关闭的弹窗交还，不用右键猜测处理
• 外交自动化：自动向最近的城邦派使节；实时读取各文明关系、文化产出、经济面板
■ 深度局面洞察
• 解析你的存档：回合数、地图、你的文明/领袖/特性、所有敌对文明、城邦列表、已装 MOD
• 给出开局/科技/建城/战争/胜利路线建议（规则化、可追溯，不是空话）
■ 怎么开始
跟 YUI 说「开始托管文明6」即可；托管期间可随时要求「交还」手动操作。
■ 边界与安全
• 存档解析与局面查询只读；托管会通过 FireTuner 执行生产、研究、单位与回合等写操作，但不改存档
• 生产与回合使用官方数据读回验证；屏幕路径只在模板确认后点击，无法确认就交还，不编状态
• 自动装 Steam SDK（appid 597260）时只做最小必要安装，可随时关掉
■ 版本：v0.6.8 加固托管互斥与交还停止、生产读回、敌我识别、通知与世界议会清理，并移除不安全的右键/盲点自愈。
"""
short_description = "文明6陪玩：按官方数据托管生产、研究、政策与回合；写操作读回验证，识别不确定即交还，不改存档"
keywords = ["文明6", "Civilization VI", "Civ6", "陪玩", "自动回合", "托管运营", "科技", "市政", "政策", "万神殿", "总督", "侦察兵探路", "弹窗处理", "外交使节", "FireTuner", "存档解析", "Civ6Save", "局面洞察", "胜利路线", "城邦", "领袖", "不瞎点", "读回验证", "键鼠接管", "交还", "situation", "advisor", "buddy", "coach", "takeover", "官方API"]
version = "0.6.8"
type = "plugin"
entry = "plugin.plugins.civ6_buddy:Civ6BuddyPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
